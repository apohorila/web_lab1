version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: brand_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: student
      POSTGRES_DB: brand_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: brand_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: annapohorila07@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

 api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: brand_api
    restart: always
    ports:
      - "5038:5000"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=brand_db;Username=admin;Password=student
    depends_on:
      - postgres     

volumes:
  pgdata:
