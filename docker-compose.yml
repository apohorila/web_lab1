version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: brand_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: student
      POSTGRES_DB: brand_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: brand_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: annapohorila07@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: brand_redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:latest
    container_name: local-blob-storage
    ports:
      - "4566:4566"            # S3 API / Edge port
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brand_api
    restart: always
    ports:
      - "5038:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=brand_db;Username=admin;Password=student
      - Authentication__GoogleClientId=${GOOGLE_CLIENT_ID}
      - Authentication__AdminEmail=${ADMIN_EMAIL}
      - Jwt__Key=${JWT_KEY}
      - Cache__Provider=Redis
      - Cache__RedisConnection=redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=1000,asyncTimeout=1000
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__ChatId=${TELEGRAM_CHAT_ID}
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
  localstack_data:
