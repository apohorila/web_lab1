$kind: http-request
url: "{{baseUrl}}/api/categories"
method: GET
headers:
  Origin: http://localhost:5173
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Access-Control-Expose-Headers lists X-Cache", function () { pm.expect((pm.response.headers.get("Access-Control-Expose-Headers") || "").toLowerCase()).to.include("x-cache"); });
    language: text/javascript
order: 1000
