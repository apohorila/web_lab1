$kind: http-request
url: "{{baseUrl}}/api/stats/sales?days=7"
method: GET
queryParams:
  days: "7"
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 403 Forbidden", function () { pm.response.to.have.status(403); });
      pm.test("Not served from cache", function () { pm.expect(pm.response.headers.get("X-Cache")).to.not.eql("HIT"); });
    language: text/javascript
order: 9000
