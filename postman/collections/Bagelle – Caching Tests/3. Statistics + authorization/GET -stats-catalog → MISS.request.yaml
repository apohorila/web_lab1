$kind: http-request
name: GET /stats/catalog → MISS
url: "{{baseUrl}}/api/stats/catalog"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Cache headers are present (Cache:Provider must not be None)", function () { pm.expect(pm.response.headers.get("X-Cache"), "X-Cache header missing").to.be.a("string"); pm.expect(["Memory", "Redis"]).to.include(pm.response.headers.get("X-Cache-Provider")); });
      pm.test("X-Cache is MISS", function () { pm.expect(pm.response.headers.get("X-Cache")).to.eql("MISS"); });
      console.log("MISS: " + pm.response.responseTime + " ms  <- " + pm.request.url.getPath());
      pm.collectionVariables.set("statsBody", pm.response.text());
      var s = pm.response.json(); pm.collectionVariables.set("totalProducts", s.totalProducts);
      pm.test("Has totals, per-category counts and showrooms", function () { pm.expect(s.totalProducts).to.be.a("number"); pm.expect(s.productsPerCategory).to.be.an("array"); pm.expect(s.showrooms).to.be.an("array"); });
    language: text/javascript
order: 1000
