$kind: http-request
name: Same URL WITHOUT a token → 401 (cache never bypasses authorization)
url: "{{baseUrl}}/api/stats/sales?days=7"
method: GET
queryParams:
  days: "7"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401 Unauthorized", function () { pm.response.to.have.status(401); });
      pm.test("Not served from cache", function () { pm.expect(pm.response.headers.get("X-Cache")).to.not.eql("HIT"); });
    language: text/javascript
order: 8000
