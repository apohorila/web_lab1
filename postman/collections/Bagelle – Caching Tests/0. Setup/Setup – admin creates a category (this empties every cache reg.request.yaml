$kind: http-request
name: Setup – admin creates a category (this empties every cache region)
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{catName}}",
      "description": "cache test"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("catName", "PM Cache " + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201 Created", function () { pm.response.to.have.status(201); });
      pm.collectionVariables.set("categoryId", pm.response.json().id);
    language: text/javascript
order: 3000
