$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.test("Token returned and email matches", function () { pm.expect(json.token).to.be.a("string").and.not.empty; pm.expect(json.user.email).to.eql(pm.collectionVariables.get("customerEmail")); });
      pm.collectionVariables.set("customerToken", json.token);
    language: text/javascript
order: 1000
