$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "WrongPassw0rd!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401 Unauthorized", function () { pm.response.to.have.status(401); });
      pm.test("No token in the response", function () { pm.expect(pm.response.json()).to.not.have.property("token"); });
    language: text/javascript
order: 3000
