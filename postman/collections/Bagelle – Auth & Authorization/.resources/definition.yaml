$kind: collection
description: |-
  Automated checks for authentication (register/login/JWT) and authorization (401/403, roles, order ownership).

  Run the folders in order (Collection Runner / newman).
  Optional: set the collection variable `adminToken` (copy `bagelle_token` from localStorage after logging in as admin on the site) to enable the admin checks.

  Every run registers a few throw-away users with emails like pm_<timestamp>_<n>@example.com.
