$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderIdA}}/cancel"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{customerBToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 404 Not Found", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 6000
