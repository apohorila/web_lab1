$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderIdA}}/cancel"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 400 Bad Request", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 11000
