$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{tmpEmail}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      var uid = "pm_" + Date.now() + "_" + Math.floor(Math.random() * 1000000) + "@example.com";
      pm.variables.set("tmpEmail", uid);
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status is 400 Bad Request", function () { pm.response.to.have.status(400); });
    language: text/javascript
order: 4000
