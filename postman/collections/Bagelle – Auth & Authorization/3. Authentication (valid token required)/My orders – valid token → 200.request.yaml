$kind: http-request
url: "{{baseUrl}}/api/orders/my"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Body is an array", function () { pm.expect(pm.response.json()).to.be.an("array"); });
    language: text/javascript
order: 7000
