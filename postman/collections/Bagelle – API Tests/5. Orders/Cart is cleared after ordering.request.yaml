$kind: http-request
url: "{{baseUrl}}/api/cart"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Cart is empty", function () { pm.expect(pm.response.json().items).to.be.an("array").that.is.empty; });
    language: text/javascript
order: 11000
