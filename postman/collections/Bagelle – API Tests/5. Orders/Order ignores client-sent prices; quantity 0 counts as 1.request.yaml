$kind: http-request
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerName": "Postman Tester",
      "customerPhone": "+380000000000",
      "customerEmail": "{{customerEmail}}",
      "deliveryCity": "Київ",
      "deliveryAddress": "Відділення №1",
      "items": [
        {
          "productId": {{orderProductId}},
          "quantity": 0,
          "unitPrice": 1
        }
      ],
      "totalAmount": 1
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("totalAmount = real price × 1, not 1", function () { pm.expect(pm.response.json().totalAmount).to.be.closeTo(Number(pm.collectionVariables.get("orderProductPrice")), 0.001); });
    language: text/javascript
order: 3000
