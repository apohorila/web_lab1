$kind: http-request
url: "{{baseUrl}}/api/orders/{{orderId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Contains the ordered product", function () { pm.expect(pm.response.json().items[0].productId).to.eql(Number(pm.collectionVariables.get("orderProductId"))); });
    language: text/javascript
order: 13000
