$kind: http-request
url: "{{baseUrl}}/api/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customerName": "Postman Tester",
      "customerPhone": "+380000000000",
      "customerEmail": "{{customerEmail}}",
      "deliveryCity": "Київ",
      "deliveryAddress": "Відділення №1",
      "items": [
        {
          "productId": {{orderProductId}},
          "quantity": 1
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      var j = pm.response.json();
      pm.test("orderId returned", function () { pm.expect(j.orderId).to.be.a("number"); });
      pm.collectionVariables.set("orderId", j.orderId);
    language: text/javascript
order: 10000
