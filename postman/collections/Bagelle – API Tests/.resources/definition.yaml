$kind: collection
description: |-
  Functional API tests for Bagelle: categories, showrooms, products, cart and orders, with positive and negative cases.

  HOW TO RUN
  1. Start the API (default http://localhost:5038, change the `baseUrl` variable if needed).
  2. Set the collection variable `adminToken` (Current value): log in as admin on the site, then in the browser console run  localStorage.getItem("bagelle_token")  and paste the result. Never put it in the Initial value, because that gets synced to the repo.
  3. Run the whole collection with the Collection Runner (folders run in order and share ids).

  WHAT IT TOUCHES
  - Admin steps create their own category, showroom and product and delete them in the last folder.
  - It registers one throw-away customer (pm_api_*@example.com) per run.
  - Two guest orders per run cannot be deleted through the API.
  Auth/role/ownership checks live in the separate collection "Bagelle – Auth & Authorization".
