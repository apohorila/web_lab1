$kind: http-request
url: "{{baseUrl}}/api/showrooms/{{showroomId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Phone and address were updated", function () { var j = pm.response.json(); pm.expect(j.phone).to.eql("+380000000002"); pm.expect(j.address).to.eql("вул. Оновлена, 2"); });
    language: text/javascript
order: 6000
