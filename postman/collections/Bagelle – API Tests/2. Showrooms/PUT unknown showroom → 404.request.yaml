$kind: http-request
url: "{{baseUrl}}/api/showrooms/999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "PM Showroom",
      "address": "вул. Тестова, 1",
      "workingHours": "10:00-20:00",
      "phone": "+380000000001",
      "latitude": 50.45,
      "longitude": 30.52,
      "id": 999999
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 404 Not Found", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 8000
