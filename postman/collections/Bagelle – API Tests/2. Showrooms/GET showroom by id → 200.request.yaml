$kind: http-request
url: "{{baseUrl}}/api/showrooms/{{showroomId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Fields match", function () { var j = pm.response.json(); pm.expect(j.name).to.eql("PM Showroom"); pm.expect(j.workingHours).to.eql("10:00-20:00"); });
    language: text/javascript
order: 3000
