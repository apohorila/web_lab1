$kind: http-request
url: "{{baseUrl}}/api/showrooms/{{showroomId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "PM Showroom",
      "address": "вул. Оновлена, 2",
      "workingHours": "10:00-20:00",
      "phone": "+380000000002",
      "latitude": 50.45,
      "longitude": 30.52,
      "id": {{showroomId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 204 No Content", function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 5000
