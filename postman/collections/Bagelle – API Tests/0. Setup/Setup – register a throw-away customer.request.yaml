$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      var uid = "pm_api_" + Date.now() + "_" + Math.floor(Math.random() * 1000000) + "@example.com";
      pm.collectionVariables.set("customerEmail", uid);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      var json = pm.response.json();
      pm.collectionVariables.set("customerToken", json.token);
      pm.collectionVariables.set("customerId", json.user.id);
    language: text/javascript
order: 1000
