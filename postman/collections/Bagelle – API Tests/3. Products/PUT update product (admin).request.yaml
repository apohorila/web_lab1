$kind: http-request
url: "{{baseUrl}}/api/products/{{productId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "PM Test Bag UPDATED",
      "price": 4100,
      "description": "Created by Postman",
      "imageUrl": "https://example.com/pm-bag.jpg",
      "categoryId": {{categoryId}},
      "showroomId": {{showroomId}},
      "id": {{productId}}
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is one of [200, 204] (OK / No Content)", function () { pm.expect([200, 204]).to.include(pm.response.code); });
    language: text/javascript
order: 6000
