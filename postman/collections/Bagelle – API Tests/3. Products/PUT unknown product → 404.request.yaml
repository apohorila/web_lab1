$kind: http-request
url: "{{baseUrl}}/api/products/999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "PM Test Bag",
      "price": 3600,
      "description": "Created by Postman",
      "imageUrl": "https://example.com/pm-bag.jpg",
      "categoryId": {{categoryId}},
      "showroomId": {{showroomId}},
      "id": 999999
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 404 Not Found", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 9000
