$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": {{categoryId}},
      "name": "{{categoryName}} UPDATED",
      "description": "Updated by Postman"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is one of [200, 204] (OK / No Content)", function () { pm.expect([200, 204]).to.include(pm.response.code); });
    language: text/javascript
order: 6000
