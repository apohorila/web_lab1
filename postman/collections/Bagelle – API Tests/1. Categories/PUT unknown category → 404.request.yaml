$kind: http-request
url: "{{baseUrl}}/api/categories/999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": 999999,
      "name": "x"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 404 Not Found", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 9000
