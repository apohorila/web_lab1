$kind: http-request
url: "{{baseUrl}}/api/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{categoryName}}",
      "description": "Created by Postman"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("categoryName", "PM Category " + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201 Created", function () { pm.response.to.have.status(201); });
      var json = pm.response.json();
      pm.test("Returns the new category with an id", function () { pm.expect(json.id).to.be.a("number").and.above(0); pm.expect(json.name).to.eql(pm.collectionVariables.get("categoryName")); });
      pm.test("Location header points to the new resource", function () { var loc = (pm.response.headers.get("Location") || "").toLowerCase(); pm.expect(loc).to.include("/api/categories/" + json.id); });
      pm.collectionVariables.set("categoryId", json.id);
    language: text/javascript
order: 2000
