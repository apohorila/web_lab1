$kind: http-request
url: "{{baseUrl}}/api/categories/{{categoryId}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Name matches", function () { pm.expect(pm.response.json().name).to.eql(pm.collectionVariables.get("categoryName")); });
    language: text/javascript
order: 4000
