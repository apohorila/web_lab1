$kind: http-request
url: "{{baseUrl}}/api/cart/items/{{cartItemId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "quantity": 0
    }
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 13000
