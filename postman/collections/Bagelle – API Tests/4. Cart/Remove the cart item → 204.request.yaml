$kind: http-request
url: "{{baseUrl}}/api/cart/items/{{cartItemId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 204 No Content", function () { pm.response.to.have.status(204); });
    language: text/javascript
order: 9000
