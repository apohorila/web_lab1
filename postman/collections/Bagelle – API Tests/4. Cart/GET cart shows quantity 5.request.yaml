$kind: http-request
url: "{{baseUrl}}/api/cart"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () { pm.response.to.have.status(200); });
      pm.test("Quantity is 5", function () { var i = pm.response.json().items.find(function (x) { return x.id === Number(pm.collectionVariables.get("cartItemId")); }); pm.expect(i.quantity).to.eql(5); });
    language: text/javascript
order: 7000
