$kind: http-request
url: "{{baseUrl}}/api/cart/items/{{cartItemId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 404 Not Found", function () { pm.response.to.have.status(404); });
    language: text/javascript
order: 11000
